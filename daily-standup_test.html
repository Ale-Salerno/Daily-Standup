<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Standup</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F6F2;
    --surface: #FFFFFF;
    --surface2: #F0EFE9;
    --border: rgba(0,0,0,0.1);
    --border-md: rgba(0,0,0,0.18);
    --text: #1A1A18;
    --text2: #6B6B66;
    --text3: #ADADAA;
    --accent: #1D9E75;
    --accent-bg: #E1F5EE;
    --accent-text: #0F6E56;
    --red: #E24B4A;
    --red-bg: #FCEBEB;
    --red-text: #A32D2D;
    --amber: #BA7517;
    --amber-bg: #FAEEDA;
    --radius: 10px;
    --radius-sm: 6px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  /* ── Header ── */
  .header {
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    padding: 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo-mark {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--text);
    display: flex; align-items: center; justify-content: center;
  }
  .logo-mark svg { width: 16px; height: 16px; }
  .header-title { font-size: 15px; font-weight: 500; color: var(--text); }
  .header-sub { font-size: 12px; color: var(--text2); margin-top: 1px; }
  .today-badge {
    font-size: 12px; font-weight: 500; padding: 4px 12px;
    border-radius: 20px;
    background: var(--accent-bg); color: var(--accent-text);
    border: 0.5px solid rgba(29,158,117,0.25);
  }

  /* ── Day nav ── */
  .day-nav {
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    padding: 0 28px;
    display: flex;
    gap: 0;
  }
  .day-btn {
    padding: 13px 20px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    color: var(--text2);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    margin-bottom: -0.5px;
  }
  .day-btn .day-short { font-size: 13px; font-weight: 500; }
  .day-btn .day-date { font-size: 10px; font-family: 'DM Mono', monospace; letter-spacing: 0.04em; }
  .day-btn:hover { color: var(--text); }
  .day-btn.active { color: var(--text); border-bottom-color: var(--text); font-weight: 500; }

  /* ── Main layout ── */
  .main { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; }

  /* ── Session top ── */
  .session-top {
    display: flex; align-items: flex-start; justify-content: space-between;
    margin-bottom: 24px;
  }
  .session-date { font-size: 22px; font-weight: 500; color: var(--text); }
  .session-meta { font-size: 13px; color: var(--text2); margin-top: 3px; }

  /* ── Yesterday's context (hidden from management view) ── */
  .context-strip {
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 22px;
  }
  .context-label {
    font-size: 10px; font-weight: 500; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--text3); margin-bottom: 10px;
  }
  .context-entries { display: flex; flex-direction: column; gap: 8px; }
  .context-entry { display: flex; gap: 10px; align-items: flex-start; }
  .context-entry-text { font-size: 13px; color: var(--text2); line-height: 1.5; }
  .context-entry-name { font-size: 12px; font-weight: 500; color: var(--text3); min-width: 52px; }
  .blocker-pill {
    display: inline-block; font-size: 10px; font-weight: 500;
    padding: 1px 7px; border-radius: 20px;
    background: var(--red-bg); color: var(--red-text);
    margin-left: 6px; vertical-align: middle;
  }

  /* ── Members ── */
  .members { display: flex; flex-direction: column; gap: 10px; }
  .member-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .member-card.has-blocker { border-left: 2.5px solid var(--red); }

  .card-top {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px 10px;
  }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 500; flex-shrink: 0;
    font-family: 'DM Mono', monospace;
  }
  .av-a { background: #E1F5EE; color: #0F6E56; }
  .av-b { background: #EEEDFE; color: #3C3489; }
  .av-c { background: #FAEEDA; color: #633806; }
  .av-d { background: #FBEAF0; color: #72243E; }

  .card-name { font-size: 14px; font-weight: 500; flex: 1; }
  .blocker-toggle {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text2); cursor: pointer;
  }
  .blocker-toggle input { accent-color: var(--red); cursor: pointer; }

  .card-fields {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; padding: 0 18px 14px;
  }
  .field-wrap { display: flex; flex-direction: column; gap: 4px; }
  .field-label {
    font-size: 10px; font-weight: 500; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--text3);
  }
  textarea {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; line-height: 1.55;
    padding: 9px 11px;
    border: 0.5px solid var(--border-md);
    border-radius: var(--radius-sm);
    background: var(--surface2);
    color: var(--text);
    resize: none;
    min-height: 64px;
    transition: border-color 0.15s, background 0.15s;
    width: 100%;
  }
  textarea:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--surface);
  }
  textarea::placeholder { color: var(--text3); }

  /* followup field — visually identical, just different placeholder */
  .followup-area { padding: 0 18px 14px; }
  .followup-area .field-label { margin-bottom: 4px; display: block; }
  .followup-area textarea { min-height: 52px; }

  /* ── Footer actions ── */
  .footer-actions {
    display: flex; justify-content: flex-end; gap: 8px;
    margin-top: 20px;
  }
  .btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    padding: 8px 18px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    border: 0.5px solid var(--border-md);
    background: var(--surface);
    color: var(--text);
    transition: background 0.15s;
  }
  .btn:hover { background: var(--surface2); }
  .btn-accent {
    background: var(--text);
    color: #fff;
    border-color: var(--text);
  }
  .btn-accent:hover { background: #333; }

  /* ── Section divider ── */
  .divider {
    border: none; border-top: 0.5px solid var(--border);
    margin: 22px 0;
  }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: #fff;
    font-size: 13px; padding: 10px 20px;
    border-radius: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 600px) {
    .card-fields { grid-template-columns: 1fr; }
    .main { padding: 20px 14px 50px; }
    .header { padding: 14px 16px; }
    .day-nav { padding: 0 10px; overflow-x: auto; }
    .day-btn { padding: 12px 14px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="logo-mark">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="8" cy="5" r="2.5" fill="white"/>
        <path d="M3 13c0-2.76 2.24-5 5-5s5 2.24 5 5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div>
      <div class="header-title">Daily Standup</div>
      <div class="header-sub" id="header-sub">Loading…</div>
    </div>
  </div>
  <div class="today-badge" id="today-badge">Today</div>
</header>

<nav class="day-nav" id="day-nav"></nav>

<main class="main">
  <div id="session"></div>
</main>

<div class="toast" id="toast"></div>

<script>
// ─── CONFIG — paste your two Power Automate URLs here ─────────────────────
const FLOW_WRITE = 'https://default1f252d27bac44c29a4b3006a07ed96.41.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/c534daa9a911447fa4fff234ea32545f/triggers/manual/paths/invoke?api-version=1';  // Step 2 HTTP POST URL
const FLOW_READ  = 'https://default1f252d27bac44c29a4b3006a07ed96.41.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/2cda8ba466a947469faaa3982d70a476/triggers/manual/paths/invoke?api-version=1';   // Step 3 HTTP GET URL
// ─────────────────────────────────────────────────────────────────────────

const MEMBERS = [
  { id: 'a', initials: 'AS', name: 'Ale Salerno', cls: 'av-a' },
  { id: 'b', initials: 'AB', name: 'Artem Bandura', cls: 'av-b' },
  { id: 'c', initials: 'MF', name: 'Manu Fajardo', cls: 'av-c' },
  { id: 'd', initials: 'ASV', name: 'Alejandro Serrano', cls: 'av-d' },
];

const ASYNC_DAYS = new Set([1, 3]);
const DAYS  = ['Monday','Tuesday','Wednesday','Thursday','Friday'];
const SHORT = ['Mon','Tue','Wed','Thu','Fri'];

// ─── Helpers ──────────────────────────────────────────────────────────────
function getTodayIdx() {
  const d = new Date().getDay();
  return (d === 0 || d === 6) ? 0 : d - 1;
}

function getWeekDates() {
  const now = new Date(), d = now.getDay();
  const mon = new Date(now);
  mon.setDate(now.getDate() - (d === 0 ? 6 : d - 1));
  return Array.from({ length: 5 }, (_, i) => {
    const dt = new Date(mon);
    dt.setDate(mon.getDate() + i);
    return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  });
}

function weekStart() {
  const now = new Date(), d = now.getDay();
  const mon = new Date(now);
  mon.setDate(now.getDate() - (d === 0 ? 6 : d - 1));
  return mon.toISOString().slice(0, 10);
}

function spField(entries, memberId, field) {
  const e = entries.find(e => e.MemberID === memberId);
  return e ? (e[field] || '') : '';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

// ─── API calls ────────────────────────────────────────────────────────────
async function loadEntries(dayIdx) {
  const url = `${FLOW_READ}&weekStart=${weekStart()}&dayIndex=${dayIdx}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('Read failed');
  return r.json(); // expects array of {MemberID, WorkOn, ForTeam, Followup, Blocker}
}

async function writeEntry(dayIdx, memberId, fields) {
  await fetch(FLOW_WRITE, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ weekStart: weekStart(), dayIndex: String(dayIdx), memberId, ...fields }),
  });
}

// ─── State ────────────────────────────────────────────────────────────────
let currentDay = getTodayIdx();
const weekDates = getWeekDates();
let spEntries = [], prevEntries = [];

// ─── Render ───────────────────────────────────────────────────────────────
function buildNav() {
  document.getElementById('day-nav').innerHTML = DAYS.map((d, i) => `
    <button class="day-btn ${i === currentDay ? 'active' : ''}" onclick="switchDay(${i})">
      <span class="day-short">${SHORT[i]}</span>
      <span class="day-date">${weekDates[i]}</span>
    </button>`).join('');
}

function buildSession() {
  const isAsync = ASYNC_DAYS.has(currentDay);
  document.getElementById('header-sub').textContent = `Week of ${weekDates[0]} — ${weekDates[4]}`;
  document.getElementById('today-badge').textContent = currentDay === getTodayIdx() ? 'Today' : weekDates[currentDay];

  let html = `
    <div class="session-top">
      <div>
        <div class="session-date">${DAYS[currentDay]}</div>
        <div class="session-meta">${weekDates[currentDay]} &middot; Daily standup</div>
      </div>
    </div>`;

  if (isAsync && prevEntries.length) {
    html += `
      <div class="context-strip">
        <div class="context-label">Yesterday's entries</div>
        <div class="context-entries">
          ${MEMBERS.map(m => {
            const txt = spField(prevEntries, m.id, 'WorkOn');
            const blk = spField(prevEntries, m.id, 'Blocker') === 'true';
            if (!txt) return '';
            return `<div class="context-entry">
              <span class="context-entry-name">${m.name}</span>
              <span class="context-entry-text">${txt}${blk ? '<span class="blocker-pill">Blocker</span>' : ''}</span>
            </div>`;
          }).join('')}
        </div>
      </div>`;
  }

  html += `<div class="members">`;
  html += MEMBERS.map(m => {
    const blk = spField(spEntries, m.id, 'Blocker') === 'true';
    return `
      <div class="member-card ${blk ? 'has-blocker' : ''}" id="card-${m.id}">
        <div class="card-top">
          <div class="avatar ${m.cls}">${m.initials}</div>
          <div class="card-name">${m.name}</div>
          <label class="blocker-toggle">
            <input type="checkbox" ${blk ? 'checked' : ''} onchange="toggleBlocker('${m.id}', this.checked)">
            Flag blocker
          </label>
        </div>
        <div class="card-fields">
          <div class="field-wrap">
            <span class="field-label">Working on</span>
            <textarea id="work-${m.id}" placeholder="What are you focusing on today?">${spField(spEntries, m.id, 'WorkOn')}</textarea>
          </div>
          <div class="field-wrap">
            <span class="field-label">For the team</span>
            <textarea id="team-${m.id}" placeholder="Anything the team should know?">${spField(spEntries, m.id, 'ForTeam')}</textarea>
          </div>
        </div>
        ${isAsync ? `
        <div class="followup-area">
          <span class="field-label">Followup / note</span>
          <textarea id="fu-${m.id}" placeholder="Leave a note based on yesterday's update…">${spField(spEntries, m.id, 'Followup')}</textarea>
        </div>` : ''}
      </div>`;
  }).join('');

  html += `</div>
    <div class="footer-actions">
      <button class="btn btn-accent" onclick="saveDay()">Save entries</button>
    </div>`;

  document.getElementById('session').innerHTML = html;
}

// ─── Actions ──────────────────────────────────────────────────────────────
async function saveDay() {
  showToast('Saving…');
  const isAsync = ASYNC_DAYS.has(currentDay);
  try {
    await Promise.all(MEMBERS.map(m => {
      const blk = document.querySelector(`#card-${m.id} input[type=checkbox]`)?.checked || false;
      return writeEntry(currentDay, m.id, {
        WorkOn:   document.getElementById(`work-${m.id}`)?.value || '',
        ForTeam:  document.getElementById(`team-${m.id}`)?.value || '',
        Blocker:  String(blk),
        Followup: isAsync ? (document.getElementById(`fu-${m.id}`)?.value || '') : '',
      });
    }));
    showToast('Saved ✓');
  } catch(e) {
    showToast('Error saving — check flow');
    console.error(e);
  }
}

function toggleBlocker(memberId, checked) {
  document.getElementById('card-' + memberId)?.classList.toggle('has-blocker', checked);
}

async function switchDay(idx) {
  currentDay = idx;
  buildNav();
  document.getElementById('session').innerHTML = '<p style="padding:28px;color:var(--text2);font-size:13px;">Loading…</p>';
  await loadDay();
}

async function loadDay() {
  const isAsync = ASYNC_DAYS.has(currentDay);
  try {
    [spEntries, prevEntries] = await Promise.all([
      loadEntries(currentDay),
      isAsync && currentDay > 0 ? loadEntries(currentDay - 1) : Promise.resolve([]),
    ]);
  } catch(e) {
    console.error(e);
    spEntries = []; prevEntries = [];
  }
  buildSession();
}

buildNav();
loadDay();
</script>
</body>
</html>
